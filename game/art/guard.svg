  <path fill="#353136" d="M115 138l19-8 15 2-2 5-14-1-17 5zm56-7 14-5 16 3 1 4-16-2-16 5z"/>
  <path class="eyes" fill="#332d30" d="M128 142l6-1 1 12-5 1zm53-6 6-1v10l-5 2z"/>
  <path fill="#b77958" d="M157 144l11-4 11 17-11 8-15-6z"/>
  <path fill="#ded2b8" d="M109 184l10-16 18-8 17-4 11 7 8-8 16-2 11 4 9 14-14-5-11 0-16 8-13-5-17 2-15 11-12 7z"/>
