  <path fill="#59636b" d="M157 50l15 1 22 14 16 28-44-3z"/>
  <path fill="#bfa16e" d="M84 103l46-11 44-4 41 5 3 7-43-4-43 4-50 12z"/>
  <path fill="#49555e" d="M66 121l21-15 43-9 47-5 39 5 23 7 7 8-28 6-44-6-51 4-40 12-19 2z"/>
