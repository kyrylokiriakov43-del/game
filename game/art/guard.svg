<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <title>Сержант Рутгер со сторожевым фонарём</title>
  <style>
    .eyes{transform-box:fill-box;transform-origin:center 30%;animation:blink 8.4s linear infinite}
    @keyframes blink{0%,63%,65.5%,100%{transform:scaleY(1)}64.4%{transform:scaleY(.12)}}
    @media(prefers-reduced-motion:reduce){.eyes{animation:none}}
  </style>
  <!-- Wide shoulders and an old watch cloak drawn across the chest. -->
  <path fill="#39424d" d="M0 320l8-49 29-34 64-18 26-13 59-6 32 11 50 15 35 30 17 64z"/>
  <path fill="#5b6a70" d="M0 320l12-48 29-28 43-14-18 28-28 23-10 39zm219-100 41 12 36 32-13 4-43-14z"/>
  <path fill="#9e6954" d="M131 177l50-7 4 36 24 10-34 41-52-17-12-15 18-15z"/>
  <path fill="#6f7458" d="M25 261l74-42 31-12 18 20 26 14 28-36 25 9 15 24-37 35-32 47H35z"/>
  <path fill="#505742" d="M37 320l12-43 68-41 24 5-55 30-27 49zm130 0 16-62 42-36 15 17-39 35z"/>
  <path fill="#c09a61" d="M94 224l9-6 97 102h-16z"/><path fill="#d8b480" d="M131 252l22 22-12 12-22-22zm0 7-5 5 15 15 5-5z" fill-rule="evenodd"/>
