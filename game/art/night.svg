    <style>
      .rain{animation:fall 1.35s linear infinite}
      .far-rain{animation:fall 2.1s -.8s linear infinite}
      .flame,.wick{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.4s ease-in-out infinite alternate}
      .second{animation-delay:-.9s;animation-duration:1.9s}
      @keyframes fall{from{transform:translate(10px,-48px);opacity:0}18%,77%{opacity:.55}to{transform:translate(-10px,48px);opacity:0}}
      @keyframes flicker{0%,100%{transform:scale(.95,.91) skewX(-2deg)}47%{transform:scale(1.03,1.04) skewX(2deg)}}
      @media(prefers-reduced-motion:reduce){.rain,.far-rain,.flame,.wick{animation:none}}
    </style>
